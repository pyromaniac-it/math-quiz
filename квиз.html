<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Математический квиз</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        display: flex; justify-content: center; align-items: center;
        padding: 16px; overflow-x: hidden;
    }

    .container {
        width: 100%; max-width: 560px;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        overflow: hidden;
    }

    .header {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        padding: 22px 25px; color: #fff; text-align: center;
    }

    .header h1 { font-size: 22px; margin-bottom: 5px; }
    .header p { font-size: 13px; opacity: 0.9; }

    .progress-bar { height: 5px; background: #e8eaf6; }
    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #4facfe, #43e97b);
        width: 0%; transition: width 0.4s;
    }

    .screen { display: none; padding: 30px 25px; }
    .screen.active { display: block; }

    .screen h2 { font-size: 20px; color: #2c3e50; margin-bottom: 15px; text-align: center; }
    .screen p { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 18px; text-align: center; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 600; }
    .field input {
        width: 100%; padding: 13px 16px;
        font-size: 16px; border: 2px solid #d0e4ff;
        border-radius: 10px; outline: none;
        font-family: inherit; transition: all 0.3s;
    }
    .field input:focus { border-color: #4facfe; box-shadow: 0 0 0 3px rgba(79,172,254,0.15); }

    .btn {
        display: block; width: 100%;
        padding: 15px; font-size: 16px; font-weight: 700;
        color: #fff; background: linear-gradient(135deg, #4facfe, #00f2fe);
        border: none; border-radius: 12px; cursor: pointer;
        font-family: inherit; transition: all 0.3s;
        box-shadow: 0 6px 20px rgba(79,172,254,0.4);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(79,172,254,0.5); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .question-counter {
        text-align: center; font-size: 12px;
        color: #888; text-transform: uppercase;
        letter-spacing: 1px; margin-bottom: 15px;
    }

    .question {
        font-size: 26px; font-weight: 700;
        color: #2c3e50; text-align: center;
        margin: 15px 0 25px; min-height: 60px;
        line-height: 1.3;
    }

    .answers { display: grid; gap: 12px; }

    .answer-btn {
        padding: 16px 20px; font-size: 17px; font-weight: 600;
        color: #4facfe; background: #f0f6ff;
        border: 2px solid #d0e4ff; border-radius: 12px;
        cursor: pointer; font-family: inherit;
        transition: all 0.2s; text-align: left;
    }
    .answer-btn:hover:not(:disabled) {
        background: #4facfe; color: #fff;
        transform: translateX(5px);
    }
    .answer-btn.correct { background: #43e97b; color: #fff; border-color: #43e97b; }
    .answer-btn.wrong { background: #ff6b6b; color: #fff; border-color: #ff6b6b; }
    .answer-btn:disabled { cursor: not-allowed; }

    .feedback {
        text-align: center; font-size: 15px;
        font-weight: 600; margin-top: 15px;
        min-height: 22px;
    }
    .feedback.correct { color: #43e97b; }
    .feedback.wrong { color: #ff6b6b; }

    .result-icon { font-size: 70px; text-align: center; margin-bottom: 10px; }
    .result-score {
        font-size: 52px; font-weight: 700;
        color: #4facfe; text-align: center; margin: 15px 0;
    }
    .result-text { font-size: 16px; color: #555; text-align: center; margin-bottom: 10px; }
    .result-sub { font-size: 13px; color: #999; text-align: center; margin-bottom: 20px; }

    .sending {
        text-align: center; padding: 15px;
        color: #888; font-size: 14px;
    }
    .spinner {
        display: inline-block; width: 20px; height: 20px;
        border: 3px solid #d0e4ff; border-top-color: #4facfe;
        border-radius: 50%; animation: spin 0.8s linear infinite;
        vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
        .question { font-size: 22px; }
        .header h1 { font-size: 18px; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📚 Математический квиз</h1>
        <p>Проверь свои знания!</p>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <!-- ЭКРАН 1: Знакомство -->
    <div id="screen-start" class="screen active">
        <h2>Добро пожаловать!</h2>
        <p>Введи свои данные, чтобы начать квиз.</p>

        <div class="field">
            <label>Имя и фамилия</label>
            <input type="text" id="inputName" placeholder="Например: Иван Петров" maxlength="50">
        </div>

        <div class="field">
            <label>Класс</label>
            <input type="text" id="inputClass" placeholder="Например: 5А" maxlength="10">
        </div>

        <button class="btn" onclick="startQuiz()">Начать квиз</button>
    </div>

    <!-- ЭКРАН 2: Вопросы -->
    <div id="screen-quiz" class="screen">
        <div class="question-counter" id="counter">Вопрос 1 из 10</div>
        <div class="question" id="question">Вопрос...</div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>
    </div>

    <!-- ЭКРАН 3: Результат -->
    <div id="screen-result" class="screen">
        <div class="result-icon" id="resultIcon">🏆</div>
        <h2 id="resultTitle">Квиз завершён!</h2>
        <div class="result-score" id="resultScore">0 / 10</div>
        <div class="result-text" id="resultText"></div>
        <div class="result-sub" id="resultSub"></div>
        <div class="sending" id="sendingStatus"></div>
    </div>
</div>

<script>
// ============================================
// https://script.google.com/macros/s/AKfycbzPTv-8i1xCHqtXp0b9gApMYmSOmi8PbbxXqAey0rPcIiATBxhRKg3GfZzGH5G1_cQ/exec
// ============================================
const SCRIPT_URL = 'https://pyromaniac-it.github.io/math-quiz/';
// ============================================

// Вопросы квиза (отредактируйте под свой предмет!)
const QUESTIONS = [
    {
        q: 'Чему равно 25 · 4?',
        answers: ['90', '100', '110', '125'],
        correct: 1
    },
    {
        q: 'Решите уравнение: x + 15 = 40',
        answers: ['15', '20', '25', '30'],
        correct: 2
    },
    {
        q: 'Чему равно 144 : 12?',
        answers: ['10', '11', '12', '13'],
        correct: 2
    },
    {
        q: 'Найдите неизвестный множитель: x · 6 = 42',
        answers: ['6', '7', '8', '9'],
        correct: 1
    },
    {
        q: 'Чему равно 17 · 8?',
        answers: ['126', '136', '146', '156'],
        correct: 1
    },
    {
        q: 'Решите уравнение: 90 : x = 15',
        answers: ['4', '5', '6', '7'],
        correct: 2
    },
    {
        q: 'Чему равно 2³ + 3²?',
        answers: ['15', '16', '17', '18'],
        correct: 2
    },
    {
        q: 'Решите: 5 · (12 − 7) = ?',
        answers: ['25', '35', '45', '55'],
        correct: 0
    },
    {
        q: 'Найдите делимое: x : 8 = 9',
        answers: ['62', '70', '72', '81'],
        correct: 2
    },
    {
        q: 'Чему равно 1000 − 375?',
        answers: ['615', '625', '635', '645'],
        correct: 1
    }
];

let state = {
    name: '',
    className: '',
    currentQuestion: 0,
    score: 0,
    locked: false,
    startTime: 0
};

function startQuiz() {
    const name = document.getElementById('inputName').value.trim();
    const className = document.getElementById('inputClass').value.trim();

    if (!name) {
        alert('Пожалуйста, введите имя!');
        return;
    }
    if (!className) {
        alert('Пожалуйста, введите класс!');
        return;
    }

    state.name = name;
    state.className = className;
    state.currentQuestion = 0;
    state.score = 0;
    state.startTime = Date.now();

    showScreen('screen-quiz');
    loadQuestion();
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function loadQuestion() {
    if (state.currentQuestion >= QUESTIONS.length) {
        finishQuiz();
        return;
    }

    state.locked = false;
    const q = QUESTIONS[state.currentQuestion];

    document.getElementById('counter').textContent =
        `Вопрос ${state.currentQuestion + 1} из ${QUESTIONS.length}`;

    const progress = (state.currentQuestion / QUESTIONS.length) * 100;
    document.getElementById('progressFill').style.width = progress + '%';

    document.getElementById('question').textContent = q.q;
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';

    const answersDiv = document.getElementById('answers');
    answersDiv.innerHTML = '';

    q.answers.forEach((ans, i) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = `${String.fromCharCode(65 + i)}) ${ans}`;
        btn.onclick = () => checkAnswer(btn, i);
        answersDiv.appendChild(btn);
    });
}

function checkAnswer(btn, index) {
    if (state.locked) return;
    state.locked = true;

    const q = QUESTIONS[state.currentQuestion];
    const allBtns = document.querySelectorAll('.answer-btn');
    allBtns.forEach(b => b.disabled = true);

    if (index === q.correct) {
        btn.classList.add('correct');
        state.score++;
        document.getElementById('feedback').textContent = '✅ Верно!';
        document.getElementById('feedback').className = 'feedback correct';
    } else {
        btn.classList.add('wrong');
        allBtns[q.correct].classList.add('correct');
        document.getElementById('feedback').textContent = `❌ Правильный ответ: ${q.answers[q.correct]}`;
        document.getElementById('feedback').className = 'feedback wrong';
    }

    setTimeout(() => {
        state.currentQuestion++;
        loadQuestion();
    }, 1200);
}

function finishQuiz() {
    const timeSec = Math.round((Date.now() - state.startTime) / 1000);
    const total = QUESTIONS.length;
    const percent = Math.round((state.score / total) * 100);

    document.getElementById('progressFill').style.width = '100%';

    let icon = '🏆';
    let title = 'Квиз завершён!';
    let message = '';

    if (percent >= 90) { icon = '🏆'; title = 'Отлично!'; message = 'Превосходный результат!'; }
    else if (percent >= 70) { icon = '🥈'; title = 'Хорошо!'; message = 'Хороший результат!'; }
    else if (percent >= 50) { icon = '🥉'; title = 'Неплохо!'; message = 'Можно лучше!'; }
    else { icon = '📚'; title = 'Нужно повторить'; message = 'Потренируйся ещё!'; }

    document.getElementById('resultIcon').textContent = icon;
    document.getElementById('resultTitle').textContent = title;
    document.getElementById('resultScore').textContent = `${state.score} / ${total}`;
    document.getElementById('resultText').textContent = message;
    document.getElementById('resultSub').textContent = `Время: ${timeSec} сек.`;

    showScreen('screen-result');

    // Отправляем результат учителю
    sendResult({
        name: state.name,
        className: state.className,
        score: state.score,
        total: total,
        time: timeSec
    });
}

function sendResult(data) {
    const statusEl = document.getElementById('sendingStatus');
    statusEl.innerHTML = '<span class="spinner"></span>Отправка результата...';

    if (SCRIPT_URL.includes('ВСТАВЬТЕ')) {
        statusEl.innerHTML = '⚠️ URL скрипта не настроен (см. шаг 1.4)';
        return;
    }

    fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(() => {
        statusEl.innerHTML = '✅ Результат отправлен учителю!';
    })
    .catch(() => {
        statusEl.innerHTML = '❌ Ошибка отправки. Сообщите учителю.';
    });
}
</script>

</body>
</html>
